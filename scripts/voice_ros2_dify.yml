    - data:
        answer: ''
        desc: 将自然语言指令提取为结构化信息
        selected: false
        title: ① 指令信息提取
        type: llm
        variables: []
        context:
          enabled: false
        model:
          completion_params:
            stop: []
            temperature: 0.1
            max_tokens: 512
            top_p: 0.95
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - id: cb95bbcd-1394-4807-819c-958dd04969c3
          role: system
          text: '你是一个双臂机械臂控制助手。请从用户指令中提取结构化信息。


            【思考流程】

            1. 先理解用户说了几个动作，按顺序编号

            2. 对每个动作判断：是移动(move_cartesian)还是关节旋转(move_joint)

            3. 确定是哪条臂(left/right)

            4. 提取数值并换算单位

            5. 确定正负号（左负右正，后负前正，下负上正）


            【动作判断规则】

            - 移动类关键词：上下左右前后、移动、走、抬、降

            - 关节类关键词：关节、旋转、转动


            【坐标系】

            - 右→x正  左→x负  前→y正  后→y负  上(升)→z正  下(降)→z负


            【单位换算】

            - 距离：厘米÷100→米（如5厘米=0.05米）

            - 角度：度×π/180→弧度（如30度≈0.524弧度）


            【输出格式 - 严格按照以下模板】

            每行一个动作，格式：

            动作N | 臂: left/right | 类型: 移动/旋转 | 方向: 上下左右前后或关节编号 | 数值: 数字或"无" | 单位: 厘米/度/无 | 正负: 正/负


            注意：

            - 如果用户没说臂，用"未指定"

            - 如果没说数值，数值写"无"

            - 只说"反转""反向"则正负为"负"

            - 不要输出JSON，只输出结构化文本'
        - id: 58a02c5a-bea5-42df-87f7-937473245218
          role: user
          text: '{{#start.text#}}'
      height: 260
      id: a016d867-e9e3-4009-b80c-6c2bfc9192a2
      position:
        x: 380
        y: 200
      positionAbsolute:
        x: 380
        y: 200
      type: llm
      width: 240
    - data:
        code: "import json\nimport re\nimport math\n\ndef main(extracted: str) -> dict:\n    lines = [l.strip() for l in extracted.strip().split('\\\
          n') if l.strip()]\n    commands = []\n    dir_map = {'右': ('x', 1), '左': ('x', -1),\n               '前': ('y', 1),\
          \ '后': ('y', -1),\n               '上': ('z', 1), '下': ('z', -1)}\n    \n    for line in lines:\n        parts =\
          \ [p.strip() for p in line.split('|')]\n        item = {}\n        for p in parts:\n            if ':' in p:\n \
          \               key, val = p.split(':', 1)\n                item[key.strip()] = val.strip()\n        \n        arm\
          \ = item.get('臂', '未指定')\n        arm = 'right' if arm == '未指定' else arm\n        move_type = item.get('类型', '移动')\n\
          \        direction = item.get('方向', '')\n        val_str = item.get('数值', '无')\n        unit = item.get('单位', '无')\n\
          \        sign = item.get('正负', '正')\n        \n        # 数值处理\n        if val_str == '无':\n            value = 0.05\
          \ if move_type == '移动' else 0.1\n        else:\n            value = float(val_str)\n            if unit == '厘米':\n\
          \                value = value / 100.0\n            elif unit == '度':\n                value = value * math.pi /\
          \ 180.0\n        \n        if sign == '负':\n            value = -value\n        \n        if move_type == '旋转' or\
          \ '关节' in direction:\n            joint_match = re.search(r'(\\d+)', direction)\n            joint = int(joint_match.group(1))\
          \ if joint_match else 1\n            commands.append({\n                \"action\": \"move_joint\",\n          \
          \      \"arm\": arm,\n                \"joint\": joint,\n                \"value\": round(value, 4),\n         \
          \       \"type\": \"delta\"\n            })\n        else:\n            x, y, z = 0.0, 0.0, 0.0\n            for\
          \ ch in direction:\n                if ch in dir_map:\n                    axis, sgn = dir_map[ch]\n           \
          \         if axis == 'x': x = sgn * abs(value)\n                    elif axis == 'y': y = sgn * abs(value)\n   \
          \                 elif axis == 'z': z = sgn * abs(value)\n            commands.append({\n                \"action\"\
          : \"move_cartesian\",\n                \"arm\": arm,\n                \"x\": round(x, 4),\n                \"y\"\
          : round(y, 4),\n                \"z\": round(z, 4),\n                \"relative\": True\n            })\n    \n\
          \    return {\"result\": json.dumps(commands, ensure_ascii=False)}"
        code_language: python
        desc: 将结构化信息转换为JSON命令（单位换算、坐标映射）
        outputs:
        - type: string
          variable: result
        selected: false
        title: ② 参数计算与JSON组装
        type: code
        variables:
        - variable: extracted
          value_selector:
          - a016d867-e9e3-4009-b80c-6c2bfc9192a2
          - text
      height: 220
      id: 0bfcc33e-db77-40b9-9a43-1292d2ed1c1d
      position:
        x: 720
        y: 200
      positionAbsolute:
        x: 720
